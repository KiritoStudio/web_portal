<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Home Portal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="bar">
  <div class="logo">
    <div class="m">H</div>
    <div class="name"><b>Home Portal</b><small id="stat">Loading…</small></div>
  </div>

  <form class="gsearch" action="https://www.google.com/search" method="get" target="_blank" rel="noopener noreferrer" role="search">
    <span class="glogo" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 48 48">
        <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.7-2.1 5-4.4 6.6v5.500h7.1c4.2-3.8 6.6-9.5 6.6-16.1z"/>
        <path fill="#34A853" d="M24 46c6 0 11-2 14.6-5.4l-7.1-5.5c-2 1.3-4.5 2.1-7.5 2.1-5.8 0-10.6-3.9-12.4-9.1H4.3v5.7C7.9 41 15.4 46 24 46z"/>
        <path fill="#FBBC05" d="M11.6 28.1c-.4-1.3-.7-2.7-.7-4.1s.2-2.8.7-4.1v-5.7H4.3C2.8 17.1 2 20.4 2 24s.8 6.9 2.3 9.8l7.3-5.7z"/>
        <path fill="#EA4335" d="M24 10.8c3.3 0 6.2 1.1 8.5 3.3l6.3-6.3C35 4.3 30 2 24 2 15.4 2 7.9 7 4.3 14.2l7.3 5.7c1.8-5.2 6.6-9.1 12.4-9.1z"/>
      </svg>
    </span>
    <input type="text" name="q" id="gq" placeholder="Search Google" aria-label="Search Google" autocomplete="off">
    <button type="button" class="gclear" id="gclear" aria-label="Clear" tabindex="-1" hidden>
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </form>

  <div class="find">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
    <input id="q" type="search" placeholder="Search links" aria-label="Search links on this page">
  </div>

  <div class="seg" role="group" aria-label="View">
    <button id="v-flat" aria-pressed="true">All</button>
    <button id="v-group" aria-pressed="false">By group</button>
  </div>

  <button class="btn icon" id="add" aria-label="Add a link" title="Add a link">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>
  </button>

  <div class="menu-wrap">
    <button class="btn ghost icon" id="more" aria-label="More" aria-expanded="false">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="8" cy="13" r="1.4"/></svg>
    </button>
    <div class="menu" id="menu" hidden>
      <button type="button" data-menu="export">Export config</button>
      <button type="button" data-menu="import">Import config</button>
    </div>
  </div>
</header>

<main class="canvas" id="canvas"></main>

<input type="file" id="file" accept="application/json,.json" hidden>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="stitle">
    <h2 id="stitle">Add a link</h2>
    <form class="form" id="form">
      <div class="field">
        <label for="f-name">Display name</label>
        <input id="f-name" maxlength="64" required placeholder="Synology DSM">
      </div>
      <div class="field">
        <label for="f-url">Address</label>
        <input id="f-url" required placeholder="http://192.168.1.10:5000">
        <div class="hint">An IP or a LAN hostname — saved and opened exactly as you type it.</div>
      </div>
      <div class="field">
        <label for="f-group">Group</label>
        <input id="f-group" maxlength="64" autocomplete="off" placeholder="Leave empty for ungrouped">
        <div class="chips" id="chips"></div>
        <div class="hint">Pick one above, or type a new name — it gets created when you save.</div>
      </div>
      <p class="err" id="err" hidden></p>
      <div class="acts">
        <button type="button" class="btn ghost" id="cancel">Cancel</button>
        <button type="submit" class="btn" id="save">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" hidden><span id="tmsg"></span><button id="taction" type="button"></button></div>

<script src="/app.js"></script>
</body>
</html>
